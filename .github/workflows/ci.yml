name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.resolve.outputs.releases }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(node scripts/ci-versions.mjs)
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.release.lane }} / ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        release: ${{ fromJSON(needs.versions.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install release builds of both matchers
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          tool_versions: |
            fzf ${{ matrix.release.fzf }}
            skim ${{ matrix.release.skim }}
          add_shims_to_path: false
      - name: Install PTY host
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y tmux ;;
            macOS) brew install tmux ;;
          esac
          tmux -V
      - run: npm ci --ignore-scripts
      - name: Select Pi release and verify the tools under test
        shell: bash
        env:
          PI_AGENT: ${{ matrix.release.agent }}
          PI_TUI: ${{ matrix.release.tui }}
          FZF: ${{ matrix.release.fzf }}
          SKIM: ${{ matrix.release.skim }}
        run: |
          npm install --no-save --ignore-scripts "@earendil-works/pi-coding-agent@$PI_AGENT" "@earendil-works/pi-tui@$PI_TUI"
          npm ls --depth=0
          node --input-type=commonjs <<'NODE'
          const assert = require("node:assert/strict");
          const run = name => require("node:child_process").execFileSync(name, ["--version"], { encoding: "utf8" }).trim();
          for (const [name, expected] of [["pi-coding-agent", process.env.PI_AGENT], ["pi-tui", process.env.PI_TUI]])
            assert.equal(require(`./node_modules/@earendil-works/${name}/package.json`).version, expected, name);
          assert.equal(run("fzf").split(/\s+/)[0], process.env.FZF, "fzf on PATH");
          assert.equal(run("sk").split(/\s+/)[1], process.env.SKIM, "sk on PATH");
          NODE
      - run: npm run check
      - name: Real-Pi PTY smoke suite
        if: runner.os != 'Windows'
        run: npm run test:pty
